[project]
name = "selko-workspace"
version = "0.1.0"
description = "Selko - AI-powered personal organization assistant"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "selko",
    # selko_import only: reads the old Postgres database once, at cutover.
    # Not a dependency of selko, so the image never carries a Postgres driver.
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
]

[tool.uv.sources]
selko = { workspace = true }

[tool.uv.workspace]
members = ["backend"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-randomly>=4.0",
]
