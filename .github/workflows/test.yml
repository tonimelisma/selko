name: Tests

# CI Optimization: Path filtering skips jobs when irrelevant files change.
# - Markdown-only changes: No test jobs run
# - Backend changes: Unit tests run
# - Frontend changes: Handled by frontend-tests.yml (separate workflow)
# - Supabase changes: Staging deploy + integration tests
# - Android changes: Android tests only

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      staging_action:
        description: "Staging action (apply migrations first, then deploy)"
        required: true
        type: choice
        options:
          - none
          - apply-migrations
          - deploy
        default: none
      deploy_production:
        description: "Deploy production (requires an explicit checked confirmation)"
        required: true
        type: boolean
        default: false
      require_workers:
        description: "Require staging background workers, listener, and asyncpg transport"
        required: true
        type: boolean
        default: false

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      supabase: ${{ steps.filter.outputs.supabase }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'cli/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'
            supabase:
              - 'supabase/**'
            android:
              - 'android/**'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set up Python
        run: uv python install 3.14

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          uv sync --extra test
          uv pip install pytest-xdist

      - name: Run unit tests
        run: uv run pytest backend/tests/ -m "not integration" -v --tb=short -n auto

  android-unit-tests:
    name: Android Unit Tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-unit-test-results
          path: android/app/build/reports/tests/

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    # Only run on main branch pushes when backend/supabase files changed
    # Note: always() required because skipped dependencies would fail this job otherwise
    # We check that required jobs either succeeded or were skipped (not failed)
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.supabase == 'true') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.android-unit-tests.result == 'success' || needs.android-unit-tests.result == 'skipped')
    needs: [changes, unit-tests, android-unit-tests]
    steps:
      - uses: actions/checkout@v7

      # Deploy database migrations first (atomic deployment requirement)
      # R5: migrations must not be behind code — see assert-schema-code-compat gate
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to Staging Supabase
        run: supabase link --project-ref lxmysergoeaegxlyfzwk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy migrations to Staging
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Verify migration gate after apply
        run: ./scripts/assert-schema-code-compat.sh --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Deploy to Render (Staging)
        run: |
          echo "Triggering Render deployments..."
          for hook_name in "App:${{ secrets.RENDER_DEPLOY_HOOK_APP_STAGING }}" "Web:${{ secrets.RENDER_DEPLOY_HOOK_WEB_STAGING }}"; do
            name="${hook_name%%:*}"
            url="${hook_name#*:}"
            if [ -z "$url" ]; then
              echo "  ${name} deploy hook not configured, skipping"
              continue
            fi
            for attempt in 1 2; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url")
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
                echo "  ${name} deploy hook triggered successfully (HTTP ${status})"
                break
              else
                echo "  ${name} deploy hook returned HTTP ${status} (attempt ${attempt}/2)"
                if [ "$attempt" -eq 2 ]; then
                  echo "  ERROR: ${name} deploy hook failed after 2 attempts"
                  exit 1
                fi
                sleep 5
              fi
            done
          done
          echo "Deploy hooks triggered. Builds will complete asynchronously."

  integration-tests-staging:
    name: Integration Tests (Staging)
    runs-on: ubuntu-latest
    # Only run on main branch pushes (after deployment succeeds)
    # Skipped when deploy-staging is skipped (no backend/supabase changes)
    if: |
      always() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.deploy-staging.result == 'success'
    needs: [deploy-staging]  # Run AFTER deployment to test deployed code
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set up Python
        run: uv python install 3.14

      - name: Install dependencies
        run: |
          uv sync --extra test
          uv pip install pytest-xdist

      - name: Run staging integration tests (no LLM calls)
        # Parallelized - each test uses isolated data (uuid4 IDs, temp_user fixtures, SKIP LOCKED claiming)
        run: uv run pytest backend/tests/integration/ -m "staging" -v --tb=short -n auto
        env:
          ENVIRONMENT: staging
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        # NOTE: The staging marker selects real Supabase/Gmail coverage but no
        # LLM tests. Real LLM calls are opt-in locally with `--run-llm`.

  manual-staging-action:
    name: Manual Staging Action
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.staging_action != 'none'
    steps:
      - uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to Staging Supabase
        run: supabase link --project-ref lxmysergoeaegxlyfzwk
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply staging migrations
        if: inputs.staging_action == 'apply-migrations'
        run: |
          supabase db push --dry-run
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Verify migration gate after apply
        if: inputs.staging_action == 'apply-migrations'
        run: ./scripts/assert-schema-code-compat.sh --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Verify migration gate
        if: inputs.staging_action == 'deploy'
        run: ./scripts/assert-schema-code-compat.sh --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Deploy staging database and services
        if: inputs.staging_action == 'deploy'
        run: |
          supabase db push --dry-run
          supabase db push
          for hook_name in "App:${{ secrets.RENDER_DEPLOY_HOOK_APP_STAGING }}" "Web:${{ secrets.RENDER_DEPLOY_HOOK_WEB_STAGING }}"; do
            name="${hook_name%%:*}"
            url="${hook_name#*:}"
            if [ -z "$url" ]; then
              echo "${name} deploy hook is not configured"
              continue
            fi
            curl --fail --silent --show-error --output /dev/null -X POST "$url"
            echo "${name} staging deploy triggered"
          done
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}

      - name: Wait for staging API
        if: inputs.staging_action == 'deploy'
        env:
          STAGING_API_BASE_URL: https://selko.onrender.com
        run: |
          health_url="${STAGING_API_BASE_URL%/}/health"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --connect-timeout 5 --max-time 15 --output /dev/null "$health_url"; then
              exit 0
            fi
            [[ "$attempt" -lt 12 ]] || exit 1
            sleep 10
          done

      - name: Check staging health surfaces
        if: inputs.staging_action == 'deploy'
        run: |
          health_json=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://selko.onrender.com/health)
          printf '%s\n' "$health_json" | ./scripts/assert-staging-health.sh root
          ingestion_json=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://selko.onrender.com/health/ingestion)
          egress_json=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://selko.onrender.com/health/egress)
          printf '%s\n' "$ingestion_json"
          printf '%s\n' "$egress_json"
          if [[ "${{ inputs.require_workers }}" == "true" ]]; then
            printf '%s\n' "$ingestion_json" | ./scripts/assert-staging-health.sh ingestion
            printf '%s\n' "$egress_json" | ./scripts/assert-staging-health.sh egress
          fi

      - name: Install uv
        if: inputs.staging_action == 'deploy'
        uses: astral-sh/setup-uv@v8.3.2
        with:
          version: latest

      - name: Set up Python
        if: inputs.staging_action == 'deploy'
        run: uv python install 3.14

      - name: Install dependencies
        if: inputs.staging_action == 'deploy'
        run: |
          uv sync --extra test
          uv pip install pytest-xdist

      - name: Run staging integration tests
        if: inputs.staging_action == 'deploy'
        run: uv run pytest backend/tests/integration/ -m staging -v --tb=short -n auto
        env:
          ENVIRONMENT: staging
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Production deployment is always an explicit operator action.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    # No dependencies - production deployment is independent
    steps:
      - uses: actions/checkout@v7

      # Deploy database migrations first (atomic deployment requirement)
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link to Production Supabase
        run: supabase link --project-ref khahcozfbnpykspvatrg
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy migrations to Production
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}

      - name: Deploy to Render (Production)
        run: |
          echo "Triggering Render deployments..."
          for hook_name in "App:${{ secrets.RENDER_DEPLOY_HOOK_APP_PRODUCTION }}" "Web:${{ secrets.RENDER_DEPLOY_HOOK_WEB_PRODUCTION }}"; do
            name="${hook_name%%:*}"
            url="${hook_name#*:}"
            if [ -z "$url" ]; then
              echo "  ${name} deploy hook not configured, skipping"
              continue
            fi
            for attempt in 1 2; do
              status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$url")
              if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
                echo "  ${name} deploy hook triggered successfully (HTTP ${status})"
                break
              else
                echo "  ${name} deploy hook returned HTTP ${status} (attempt ${attempt}/2)"
                if [ "$attempt" -eq 2 ]; then
                  echo "  ERROR: ${name} deploy hook failed after 2 attempts"
                  exit 1
                fi
                sleep 5
              fi
            done
          done
          echo "Deploy hooks triggered. Builds will complete asynchronously."
