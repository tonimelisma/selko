name: Tests

# CI Optimization: Path filtering skips jobs when irrelevant files change.
# - Markdown-only changes: No test jobs run
# - Backend changes: Unit tests run
# - Frontend changes: Handled by frontend-tests.yml (separate workflow)
# - The image (build, checks under the server's limits, push and sign on
#   main): image.yml

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/seed_screenshot_data.py'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/test.yml'

  unit-tests:
    name: Unit Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Cache uv dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Set up Python
        run: uv python install 3.14

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install dependencies
        run: |
          uv sync --extra test
          uv pip install pytest-xdist

      # Unit and integration: the integration suite needs no service, every
      # test gets its own migrated SQLite file.
      - name: Run backend tests
        run: uv run pytest backend/tests/ -v --tb=short -n auto
