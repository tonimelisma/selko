# The Selko image: build it, check it the way the server runs it, and on main
# publish ghcr.io/tonimelisma/selko:<sha> signed keylessly with cosign.
#
# The image that is checked is the image that is pushed and signed: one build,
# loaded into the runner's Docker, checked by scripts/image-lane.sh, then
# pushed by digest. Nothing is pushed unless every check passed.
#
# A server verifies a pulled image with:
#   cosign verify ghcr.io/tonimelisma/selko:<sha> \
#     --certificate-identity "https://github.com/tonimelisma/selko/.github/workflows/image.yml@refs/heads/main" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write   # push to ghcr.io (main only)
      id-token: write   # cosign keyless signing (main only)
    env:
      IMAGE: ghcr.io/tonimelisma/selko:${{ github.sha }}
      # The one-time cutover importer: a separate image, so the app image never
      # carries a Postgres driver.
      IMPORTER: ghcr.io/tonimelisma/selko-import:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the images
        run: |
          docker build --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" -t "$IMAGE" .
          docker build --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" --target importer -t "$IMPORTER" .
          docker image inspect "$IMAGE" "$IMPORTER" --format '{{index .RepoTags 0}} {{.Size}} bytes'

      # The same script as the session's image lane: a throwaway Postgres holding
      # selko_import/fixture, imported with the importer image, then image-check.sh.
      - name: Check the image (read-only root, no capabilities, 400 MB, /data only)
        env:
          SELKO_FIXTURE_POSTGRES_IMAGE: postgres:17
        run: ./scripts/image-lane.sh "$IMAGE" "$IMPORTER"

      - name: Push and sign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push -q "$IMAGE"
          docker push -q "$IMPORTER"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          importer_digest="$(docker image inspect "$IMPORTER" --format '{{index .RepoDigests 0}}')"
          echo "pushed $digest and $importer_digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "importer_digest=$importer_digest" >> "$GITHUB_OUTPUT"
        id: push

      - name: Install cosign
        if: steps.push.outputs.digest != ''
        uses: sigstore/cosign-installer@v3

      - name: Sign the pushed digest
        if: steps.push.outputs.digest != ''
        run: |
          for ref in "${{ steps.push.outputs.digest }}" "${{ steps.push.outputs.importer_digest }}"; do
            cosign sign --yes "$ref"
            cosign verify "$ref" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com >/dev/null
            echo "signed and verified $ref"
          done
