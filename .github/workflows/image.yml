# The Selko images: build them, check them the way the server runs them, and on
# main release them. A merge to main is a release: production follows :main
# automatically (Toni, 2026-11-25).
#
# image   (every push and PR) builds ghcr.io/tonimelisma/selko and the one-time
#         importer ghcr.io/tonimelisma/selko-import, and checks them with
#         scripts/image-lane.sh. On main it pushes both as :<sha>, unsigned.
#         Nothing is pushed unless every check passed, and the image that was
#         checked is the image that is pushed (one build, pushed by digest).
# release (main only, after image passes) signs both digests with cosign
#         (keyless) and moves :main to them. The server follows :main and
#         accepts only signed digests, so only images that passed every check
#         reach production.
#
# A server verifies a pulled image with:
#   cosign verify ghcr.io/tonimelisma/selko:<sha or main> \
#     --certificate-identity "https://github.com/tonimelisma/selko/.github/workflows/image.yml@refs/heads/main" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write   # push :<sha> to ghcr.io (main only)
    env:
      IMAGE: ghcr.io/tonimelisma/selko:${{ github.sha }}
      # The one-time cutover importer: a separate image, so the app image never
      # carries a Postgres driver.
      IMPORTER: ghcr.io/tonimelisma/selko-import:${{ github.sha }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      importer_digest: ${{ steps.push.outputs.importer_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the images
        run: |
          docker build --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" -t "$IMAGE" .
          docker build --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" --target importer -t "$IMPORTER" .
          docker image inspect "$IMAGE" "$IMPORTER" --format '{{index .RepoTags 0}} {{.Size}} bytes'

      # The same script as the session's image lane: a throwaway Postgres holding
      # selko_import/fixture, imported with the importer image, then image-check.sh.
      - name: Check the image (read-only root, no capabilities, 400 MB, /data only)
        env:
          SELKO_FIXTURE_POSTGRES_IMAGE: postgres:17
        run: ./scripts/image-lane.sh "$IMAGE" "$IMPORTER"

      - name: Push :<sha>
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push -q "$IMAGE"
          docker push -q "$IMPORTER"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          importer_digest="$(docker image inspect "$IMPORTER" --format '{{index .RepoDigests 0}}')"
          echo "pushed $digest and $importer_digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "importer_digest=$importer_digest" >> "$GITHUB_OUTPUT"

  release:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # move :main
      id-token: write   # cosign keyless signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # :main must point at the very digest that was signed. `crane tag` adds a
      # tag to the existing manifest; a tool that writes a new manifest (as
      # `docker buildx imagetools create` does) would leave :main on an
      # unsigned digest, which the server rightly refuses. So the job proves
      # it: :main resolves to the signed digest and verifies by itself.
      - name: Sign both digests and move :main to them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
          IMPORTER_DIGEST: ${{ needs.image.outputs.importer_digest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          for ref in "$DIGEST" "$IMPORTER_DIGEST"; do
            repo="${ref%@*}"
            digest="${ref#*@}"
            cosign sign --yes "$ref"
            cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
            crane tag "$ref" main
            moved="$(crane digest "$repo:main")"
            if [ "$moved" != "$digest" ]; then
              echo "::error::$repo:main is $moved, not the signed $digest"
              exit 1
            fi
            cosign verify "$repo:main" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
            echo "released $ref as $repo:main (same digest, signature verified on :main)"
          done
