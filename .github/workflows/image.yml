# Release: sign the image CI built and checked, move :main to it, and watch
# production pick it up. A merge to main is a release: the server follows :main.
#
# Runs when CI completes for a push to main. Pull requests, the weekly scheduled
# run and manual CI runs never release.
#
# release  if CI's `image` job pushed ghcr.io/tonimelisma/selko:<sha> for this
#          commit (only a change to what the image is built from pushes one),
#          signs that digest with cosign (keyless) and moves :main to it. The
#          server accepts only digests signed by THIS file on main, so the path
#          .github/workflows/image.yml, this job and the main branch are the
#          signing identity: never rename the file or move the signing out of it.
# health   polls the public /health for up to 15 minutes until it answers with
#          this commit, then checks production's invariants
#          (scripts/check-production-health.sh). On failure it opens an issue
#          labelled `deploy-failure`, which is fixed first, like red CI.
#
# A server verifies a pulled image with:
#   cosign verify ghcr.io/tonimelisma/selko:<sha or main> \
#     --certificate-identity "https://github.com/tonimelisma/selko/.github/workflows/image.yml@refs/heads/main" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # move :main
      id-token: write # cosign keyless signing
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      REPO: ghcr.io/tonimelisma/selko
    outputs:
      released: ${{ steps.sign.outputs.released }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1
        with:
          cosign-release: v2.6.1

      - name: Install crane
        uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4
        with:
          version: v0.22.1

      # :main must point at the very digest that was signed. `crane tag` adds a
      # tag to the existing manifest; a tool that writes a new manifest would
      # leave :main on an unsigned digest, which the server rightly refuses. So
      # the job proves it: :main resolves to the signed digest and verifies.
      - name: Sign the digest and move :main to it
        id: sign
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          if ! digest="$(crane digest "$REPO:$SHA" 2>"$RUNNER_TEMP/digest.err")"; then
            if grep -q 'MANIFEST_UNKNOWN' "$RUNNER_TEMP/digest.err"; then
              echo "CI pushed no image for $SHA (nothing the image is built from changed): nothing to release" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/digest.err"
            echo "::error::could not ask the registry for $REPO:$SHA"
            exit 1
          fi
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          ref="$REPO@$digest"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          crane tag "$ref" main
          moved="$(crane digest "$REPO:main")"
          if [ "$moved" != "$digest" ]; then
            echo "::error::$REPO:main is $moved, not the signed $digest"
            exit 1
          fi
          cosign verify "$REPO:main" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          echo "released $ref as $REPO:main (same digest, signature verified on :main)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "released=true" >> "$GITHUB_OUTPUT"

  health:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write # open a deploy-failure issue
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      URL: https://api.selkoapp.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Wait for production to answer with this commit
        run: |
          deadline=$(( $(date +%s) + 900 ))
          while :; do
            body="$(curl -fsS --max-time 15 "$URL/health" 2>/dev/null || true)"
            running="$(printf '%s' "$body" | jq -r '.build_sha // empty' 2>/dev/null || true)"
            if [ "$running" = "$SHA" ]; then
              echo "production answers with $SHA (status $(printf '%s' "$body" | jq -r .status))"
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::after 15 minutes $URL/health answers with '${running:-nothing}', not $SHA"
              exit 1
            fi
            sleep 30
          done

      - name: Check production's health invariants
        run: ./scripts/check-production-health.sh "$URL"

      - name: Open a deploy-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy-failure -R "$GITHUB_REPOSITORY" --color B60205 \
            --description "A release that production did not pick up healthily" 2>/dev/null || true
          gh issue create -R "$GITHUB_REPOSITORY" --label deploy-failure \
            --title "Deploy failure: ${SHA:0:8} is not healthy in production" \
            --body "The release of ${SHA} was signed and :main moved, but within 15 minutes production at ${URL} did not answer /health with this commit, or its health invariants failed. Run: ${RUN_URL}. Diagnose with ./scripts/check-production-health.sh and fix forward before new work."
