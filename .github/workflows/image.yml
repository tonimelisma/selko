# The Selko images: build them, check them the way the server runs them, and on
# main release them. A merge to main is a release: production follows :main
# automatically (Toni, 2026-11-25).
#
# image   (every push and PR) builds ghcr.io/tonimelisma/selko and checks it
#         with scripts/image-lane.sh. On main it pushes it as :<sha>, unsigned.
#         Nothing is pushed unless every check passed, and the image that was
#         checked is the image that is pushed (one build, pushed by digest).
# release (main only, after image passes) signs the digest with cosign
#         (keyless) and moves :main to it. The server follows :main and
#         accepts only signed digests, so only images that passed every check
#         reach production.
#
# Only a change to what the image is built from releases. On main the trigger is
# an allowlist of the image's inputs (the files .dockerignore lets in, plus
# Dockerfile, .dockerignore and this workflow): anything else -- docs, Markdown,
# lane records, cloud-session scripts -- would rebuild identical code and
# restart production for nothing. 4406c8ac (scripts/ only) did exactly that and
# the restart ended in a rollback (docs/deploy-log/2026-11-27-4406c8ac.md).
# Pull requests also run for the image check's own scripts, so a change to the
# check is tested before it merges. Keep both lists in step with .dockerignore
# and with [lanes.image] inputs in scripts/lanes.toml.
#
# A server verifies a pulled image with:
#   cosign verify ghcr.io/tonimelisma/selko:<sha or main> \
#     --certificate-identity "https://github.com/tonimelisma/selko/.github/workflows/image.yml@refs/heads/main" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: Image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'backend/pyproject.toml'
      - 'backend/README.md'
      - 'backend/selko/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/jsconfig.json'
      - 'frontend/svelte.config.js'
      - 'frontend/vite.config.js'
      - 'frontend/postcss.config.js'
      - 'frontend/scripts/**'
      - 'frontend/src/**'
      - 'frontend/static/**'
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/image.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'backend/pyproject.toml'
      - 'backend/README.md'
      - 'backend/selko/**'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'frontend/jsconfig.json'
      - 'frontend/svelte.config.js'
      - 'frontend/vite.config.js'
      - 'frontend/postcss.config.js'
      - 'frontend/scripts/**'
      - 'frontend/src/**'
      - 'frontend/static/**'
      # The image check itself: tested on the PR, released only with the image.
      - 'scripts/build-image.sh'
      - 'scripts/image-check.sh'
      - 'scripts/image-lane.sh'
      - 'scripts/check-production-health.sh'
      - 'scripts/assert-health.sh'
      - 'backend/tests/fixtures/imported_from_postgres.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write   # push :<sha> to ghcr.io (main only)
    env:
      IMAGE: ghcr.io/tonimelisma/selko:${{ github.sha }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the image
        run: |
          docker build --build-arg "GIT_COMMIT_SHA=${GITHUB_SHA}" -t "$IMAGE" .
          docker image inspect "$IMAGE" --format '{{index .RepoTags 0}} {{.Size}} bytes'

      # The same script as the session's image lane: a fresh database, then the
      # database imported from the Postgres fixture.
      - name: Check the image (read-only root, no capabilities, 400 MB, /data only)
        run: ./scripts/image-lane.sh "$IMAGE"

      - name: Push :<sha>
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push -q "$IMAGE"
          digest="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          echo "pushed $digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  release:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write   # move :main
      id-token: write   # cosign keyless signing
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install crane
        uses: imjasonh/setup-crane@v0.4

      # :main must point at the very digest that was signed. `crane tag` adds a
      # tag to the existing manifest; a tool that writes a new manifest (as
      # `docker buildx imagetools create` does) would leave :main on an
      # unsigned digest, which the server rightly refuses. So the job proves
      # it: :main resolves to the signed digest and verifies by itself.
      - name: Sign the digest and move :main to it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/image.yml@refs/heads/main"
          issuer="https://token.actions.githubusercontent.com"
          ref="$DIGEST"
          repo="${ref%@*}"
          digest="${ref#*@}"
          cosign sign --yes "$ref"
          cosign verify "$ref" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          crane tag "$ref" main
          moved="$(crane digest "$repo:main")"
          if [ "$moved" != "$digest" ]; then
            echo "::error::$repo:main is $moved, not the signed $digest"
            exit 1
          fi
          cosign verify "$repo:main" --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" >/dev/null
          echo "released $ref as $repo:main (same digest, signature verified on :main)"
