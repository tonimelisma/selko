# Verification lanes.
#
# Each lane declares the inputs it verifies and the command that verifies them.
# The runner (scripts/verify-lanes.py) fingerprints the inputs, so a lane whose
# inputs have not changed since it last passed is reused rather than re-run.
# That is what makes a failed run cheap to retry: fix one lane, re-run, and only
# that lane executes.
#
# `gate` decides what a lane blocks:
#   prod   -> ships to a server; blocks a production deploy
#   mobile -> ships through an app store; does NOT block a production deploy
#
# Conflating these is why a flaky iOS UI test once held up a backend deploy it
# had no bearing on.

[lanes.backend]
gate = "prod"
description = "Tier 1: migrations applied to local Postgres, unit + integration"
command = "./scripts/verify.sh backend"
inputs = [
    "backend/**/*.py",
    # Non-Python files the suite reads: the MCP widget the API serves, email
    # fixtures, the skip budget, and the package manifests that build selko.
    "backend/selko/api/mcp/**",
    "backend/tests/fixtures/**",
    "backend/tests/skip_budget.toml",
    "backend/pyproject.toml",
    "cli/**/*.py",
    "cli/pyproject.toml",
    "supabase/migrations/**/*.sql",
    # Configures the local stack the integration tests run against.
    "supabase/config.toml",
    "pyproject.toml",
    "uv.lock",
    "scripts/verify.sh",
    # Read by test_ops.py / test_gate_contract.py: the workflow structure and
    # the ops payload contract are asserted by this suite.
    ".github/workflows/*.yml",
    "scripts/ops.py",
]

[lanes.schema-compat]
gate = "prod"
description = "Production would accept this tree's migrations (supabase db push --dry-run, in GitHub Actions)"
# Postgres (TCP 5432/6543) is unreachable from a cloud session and the
# production password lives only in the repository's Actions secrets, so the
# check runs as ops.yml's schema-compat operation. The command dispatches it and
# exits with the run's conclusion -- the same command on the Mac.
#
# pre-deploy, not the R5 "everything is applied" assertion: before a deploy the
# new migrations are by definition not applied yet, so R5 can only be green
# after the push. deploy-production runs R5 itself right after `db push`.
# Depends on production's state as well as the tree; use --force for a fresh
# reading after something else changed production.
command = "./scripts/ops.py dispatch schema-compat target=production when=pre-deploy"
inputs = [
    "supabase/migrations/**/*.sql",
    "backend/selko/**/*.py",
    "scripts/ops.py",
    ".github/workflows/ops.yml",
]

[lanes.migration-order]
gate = "prod"
description = "Migrations are monotonically ordered"
command = "./scripts/check-migration-order.sh"
inputs = ["supabase/migrations/**/*.sql"]

[lanes.prod-health]
# gate = "observe", NOT "prod". This lane measures the *currently deployed*
# production, so making it block a deploy is a deadlock by construction: a
# degraded production turns the gate red, and the change that would heal it can
# never ship. It was written as gate="prod" and immediately proved the point --
# it went red because production was still running the code the pending change
# fixes.
#
# It belongs after a deploy, not before one: docs/deploy-log/TEMPLATE.md calls
# it at each observation window.
gate = "observe"
description = "Production health invariants (dead letters, stale/unclaimable work, workers, listener)"
# Not fingerprinted on source: this lane checks a *running deployment*, so its
# result depends on production's state rather than on the tree. lanes.toml is
# listed so the lane re-runs whenever its own definition changes; the runner
# will otherwise reuse a cached pass, which for a live check is wrong. Treat a
# cached result here as stale by definition and use --force when you need a
# fresh reading.
command = "./scripts/check-production-health.sh"
inputs = ["scripts/check-production-health.sh", "scripts/assert-health.sh"]

[lanes.frontend]
gate = "prod"
description = "Web unit tests and svelte-check"
command = "./scripts/verify.sh frontend"
inputs = [
    "frontend/src/**",
    "frontend/tests/fixtures/**",
    "frontend/package.json",
    "frontend/package-lock.json",
    # svelte-check reads jsconfig.json; there is no tsconfig.json or
    # tailwind.config.js (themes live in src/app.css).
    "frontend/jsconfig.json",
    "frontend/svelte.config.js",
    "frontend/vite.config.js",
    "frontend/vitest.config.js",
    "frontend/vitest.setup.js",
    "scripts/verify.sh",
]

[lanes.ios]
gate = "mobile"
description = "iOS unit + UI tests on iPhone 17 Pro"
# with-api.sh owns the backend's lifetime: it starts the API only if it is not
# already up and stops only what it started. Process lifetime is not something
# anyone should have to remember -- the "stop what you start" rule was written
# down and broken within the hour, twice.
command = "rm -rf ios/TestResults.xcresult && ./scripts/with-api.sh xcodebuild test -project ios/iOS.xcodeproj -scheme iOS -destination 'platform=iOS Simulator,name=iPhone 17 Pro' -resultBundlePath ios/TestResults.xcresult"
# The API surface is an input too: with a real backend in the loop, an API
# response-shape change alters this lane's result. Without it here, a cached
# green iOS pass survives a backend change that would break the app.
inputs = [
    "ios/Selko/**",
    "ios/SelkoTests/**",
    "ios/SelkoUITests/**",
    "backend/selko/api/**",
]


[lanes.android]
gate = "mobile"
description = "Android unit tests (JVM; runs in a cloud session)"
command = "./android/gradlew -p android testDebugUnitTest"
inputs = ["android/**/*.kt", "android/**/*.kts"]

[[lanes.android.requires]]
name = "android-sdk"
check = "grep -q '^sdk.dir=' android/local.properties 2>/dev/null || test -n \"${ANDROID_HOME:-}\""
remedy = "no Android SDK: in a cloud session run scripts/cloud-setup.sh --android (the SessionStart hook starts it in the background); on the Mac install it from Android Studio"

# Emulator UI tests and screenshots need KVM, which a cloud VM lacks. They run
# in ops.yml's android-emulator operation on a GitHub-hosted runner:
#   ./scripts/ops.py dispatch android-emulator ref=<branch> --download <dir>
